# infra/docker-compose.yml
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ecommerce
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d ecommerce"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  pubsub-emulator:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    command: gcloud beta emulators pubsub start --host-port=0.0.0.0:8085 --project=e-commerce-bb89d
    ports: ["8085:8085"]

  fake-gcs-server:
    image: fsouza/fake-gcs-server
    command: -scheme http -port 4443 -public-host localhost:4443
    ports: ["4443:4443"]

  # --- app services: the full stack for local pre-push smoke testing ---

  backend:
    build:
      context: ../backend
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: postgres
      REDIS_HOST: redis
      PUBSUB_EMULATOR_HOST: pubsub-emulator:8085
      STORAGE_EMULATOR_HOST: http://fake-gcs-server:4443
      # No defaults on purpose — an empty key_id/key_secret authenticates as "nobody" and
      # Razorpay rejects it with "Authentication failed" rather than failing at boot. Put real
      # Test Mode values in infra/.env (gitignored) as RAZORPAY_KEY_ID=..., etc; compose picks
      # that file up automatically when run from this directory.
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET}
      RAZORPAY_ROUTE_ENABLED: ${RAZORPAY_ROUTE_ENABLED:-false}
    ports: ["8080:8080"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      pubsub-emulator:
        condition: service_started
      fake-gcs-server:
        condition: service_started

  storefront:
    build:
      context: ../frontend/storefront
      args:
        VITE_API_BASE_URL: http://localhost:8080
    ports: ["5173:80"]
    depends_on:
      - backend

  admin:
    build:
      context: ../frontend/admin
      args:
        VITE_API_BASE_URL: http://localhost:8080
    ports: ["5174:80"]
    depends_on:
      - backend

volumes:
  pgdata:

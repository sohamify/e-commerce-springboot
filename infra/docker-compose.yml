# infra/docker-compose.yml
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ecommerce
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  pubsub-emulator:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    command: gcloud beta emulators pubsub start --host-port=0.0.0.0:8085 --project=e-commerce-bb89d
    ports: ["8085:8085"]

  fake-gcs-server:
    image: fsouza/fake-gcs-server
    command: -scheme http -port 4443 -public-host localhost:4443
    ports: ["4443:4443"]

volumes:
  pgdata:

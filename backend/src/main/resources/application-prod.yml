spring:
  datasource:
    # Direct Supabase connection (not pooled) for both app and Flyway. Capped pool
    # size so a handful of Cloud Run instances can't exhaust Supabase's direct
    # connection limit.
    url: jdbc:postgresql://${SUPABASE_DB_HOST}:5432/postgres?sslmode=require
    username: ${SUPABASE_DB_USER}
    password: ${SUPABASE_DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  data:
    redis:
      host: ${UPSTASH_REDIS_HOST}
      port: ${UPSTASH_REDIS_PORT:6379}
      password: ${UPSTASH_REDIS_PASSWORD}
      ssl:
        enabled: true
  cloud:
    gcp:
      project-id: e-commerce-bb89d
  flyway:
    enabled: true
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
app:
  storage:
    bucket: ${STORAGE_BUCKET:e-commerce-bb89d.firebasestorage.app}
  cors:
    allowed-origins: https://ecommerce-bb89d-storefront.web.app,https://ecommerce-bb89d-storefront.firebaseapp.com,https://ecommerce-bb89d-admin.web.app,https://ecommerce-bb89d-admin.firebaseapp.com
  jwt:
    # No default: fail fast on boot rather than silently signing tokens with a guessable key.
    secret: ${JWT_SECRET}
    access-token-ttl: 15m
  refresh-token:
    ttl: 30d
  email-verification:
    ttl: 24h
  password-reset:
    ttl: 1h
  frontend:
    storefront-base-url: https://ecommerce-bb89d-storefront.web.app
    admin-base-url: https://ecommerce-bb89d-admin.web.app
  security:
    refresh-cookie:
      # Storefront/admin hosting domains differ from the backend's Cloud Run domain, so this is
      # a genuinely cross-site cookie: only SameSite=None + Secure gets it sent.
      secure: true
      same-site: None
  mail:
    from: ${MAIL_FROM:no-reply@ecommerce-bb89d.web.app}
  razorpay:
    key-id: ${RAZORPAY_KEY_ID}
    key-secret: ${RAZORPAY_KEY_SECRET}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET}
    platform-fee-percent: 10
    # Route isn't approved on the account yet — flip to true once Razorpay support enables it.
    route-enabled: ${RAZORPAY_ROUTE_ENABLED:false}
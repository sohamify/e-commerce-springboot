spring:
  datasource:
    # Direct Supabase connection (not pooled) for both app and Flyway. Capped pool
    # size so a handful of Cloud Run instances can't exhaust Supabase's direct
    # connection limit.
    url: jdbc:postgresql://${SUPABASE_DB_HOST}:5432/postgres?sslmode=require
    username: ${SUPABASE_DB_USER}
    password: ${SUPABASE_DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  data:
    redis:
      host: ${UPSTASH_REDIS_HOST}
      port: ${UPSTASH_REDIS_PORT:6379}
      password: ${UPSTASH_REDIS_PASSWORD}
      ssl:
        enabled: true
  cloud:
    gcp:
      project-id: e-commerce-bb89d
  flyway:
    enabled: true
app:
  storage:
    bucket: ${STORAGE_BUCKET:e-commerce-bb89d.firebasestorage.app}
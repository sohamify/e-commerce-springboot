# This file shadows (not merges with) src/main/resources/application.properties
# for the test classpath, so anything required there must be repeated here.

# Activates ConsoleEmailSender (@Profile({"dev","test"})) — without an active profile here,
# no NotificationSender bean exists and the context fails to start.
spring.profiles.active=test

# Pub/Sub needs either real GCP credentials or an emulator; neither is available
# during a plain `mvn test` run, and this test isn't exercising Pub/Sub behavior.
spring.cloud.gcp.pubsub.enabled=false

# Without this, Spring Boot defaults to no schema validation at all against a real (non-embedded)
# database, so a mismatch between a migration and its entity would go undetected here.
spring.jpa.hibernate.ddl-auto=validate

app.cors.allowed-origins=http://localhost:5173,http://localhost:5174

app.jwt.secret=test-only-signing-key-not-for-production-use-0123456789
app.jwt.access-token-ttl=15m
app.refresh-token.ttl=30d
app.email-verification.ttl=24h
app.password-reset.ttl=1h
app.frontend.storefront-base-url=http://localhost:5173
app.frontend.admin-base-url=http://localhost:5174
app.security.refresh-cookie.secure=false
app.security.refresh-cookie.same-site=Lax

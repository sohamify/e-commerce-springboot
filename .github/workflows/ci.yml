name: CI

on:
  pull_request:
  push:
    branches: [dev]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: ./mvnw -B verify
        working-directory: backend

  storefront:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/storefront/package-lock.json
      - run: npm ci
        working-directory: frontend/storefront
      - run: npm run lint
        working-directory: frontend/storefront
      - run: npm run build
        working-directory: frontend/storefront

  admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/admin/package-lock.json
      - run: npm ci
        working-directory: frontend/admin
      - run: npm run lint
        working-directory: frontend/admin
      - run: npm run build
        working-directory: frontend/admin
